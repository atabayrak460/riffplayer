name: riffplayer_mobile
description: RiffPlayer — self-hosted music client for Android (iOS planned)
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Audio playback + background service + lock-screen controls
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  just_audio_background: ^0.0.1-beta.12

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.7.0

  # Crypto (MD5 for Subsonic token auth)
  crypto: ^3.0.5

  # Device model, for the default Connect device name
  device_info_plus: ^10.1.2

  # Persistence
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utilities
  path: ^1.9.0
  collection: ^1.18.0
  intl: ^0.19.0
  flutter_slidable: ^4.0.3
  share_plus: ^12.0.2
  gal: ^2.3.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.1
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
